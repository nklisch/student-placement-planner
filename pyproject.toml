[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "student-placement-planner"
version = "0.1.0b2"
description = "A local-first desktop utility for planning student placements"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Student Placement Planner contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "ortools>=9.11,<10",
  "platformdirs>=4.3,<5",
  "pydantic>=2.9,<3",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
offline-maps = [
  "osmium>=4,<5",
  "pyvalhalla==3.8.3",
]
pack-build = [
  "osmium>=4,<5",
]
test = [
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-qt>=4.4,<5",
  "ruff>=0.12,<1",
]
build = [
  "pillow>=11,<12",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
student-placement-planner = "placement_optimizer.__main__:main"

[project.urls]
Homepage = "https://github.com/nklisch/student-placement-planner"
Repository = "https://github.com/nklisch/student-placement-planner"
Issues = "https://github.com/nklisch/student-placement-planner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/placement_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
