name: Build desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version for a non-published test build
        required: true
        default: 0.1.0-preview
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build version
        shell: pwsh
        env:
          TAG_VERSION: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:TAG_VERSION.TrimStart("v") } else { $env:MANUAL_VERSION }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and build dependencies
        run: python -m pip install '.[test,offline-maps,build]'

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build self-contained application
        run: pyinstaller --clean --noconfirm packaging/student-placement-planner.spec

      - name: Check bundled native dependencies
        shell: pwsh
        run: |
          $appDir = "dist\Student Placement Planner"
          foreach ($runtime in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            if (-not (Test-Path "$appDir\_internal\$runtime")) {
              throw "Bundled native runtime is missing: $runtime"
            }
          }
          if (-not (Test-Path "$appDir\_internal\ortools\.libs\ortools.dll")) {
            throw "Bundled OR-Tools native library is missing"
          }
          $env:SPP_SELF_TEST_REPORT = "$env:RUNNER_TEMP\optimizer-self-test.txt"
          $optimizationTest = Start-Process `
            -FilePath "$appDir\Student Placement Planner.exe" `
            -ArgumentList "--self-test-optimization" -Wait -PassThru
          if ($optimizationTest.ExitCode -ne 0) {
            if (Test-Path $env:SPP_SELF_TEST_REPORT) { Get-Content $env:SPP_SELF_TEST_REPORT }
            throw "Bundled OR-Tools runtime check failed"
          }
          $env:SPP_SELF_TEST_REPORT = "$env:RUNNER_TEMP\offline-builder-self-test.txt"
          $offlineTest = Start-Process `
            -FilePath "$appDir\Student Placement Planner.exe" `
            -ArgumentList "--self-test-offline-builder" -Wait -PassThru
          if ($offlineTest.ExitCode -ne 0) {
            if (Test-Path $env:SPP_SELF_TEST_REPORT) { Get-Content $env:SPP_SELF_TEST_REPORT }
            throw "Bundled offline-region builder check failed"
          }

      - name: Prepare signing certificate
        shell: pwsh
        timeout-minutes: 2
        run: |
          $password = $env:WINDOWS_CERTIFICATE_PASSWORD
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            [IO.File]::WriteAllBytes("signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            "SIGNING_KIND=trusted" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            # New-SelfSignedCertificate can block indefinitely on hosted runners
            # while initializing the Windows key store. OpenSSL produces the
            # same disposable preview certificate without touching that store.
            $password = [Guid]::NewGuid().ToString("N")
            & openssl req -x509 -newkey rsa:3072 -sha256 -nodes `
              -keyout signing.key -out signing.pem -days 730 `
              -subj "/CN=Student Placement Planner Preview" `
              -addext "extendedKeyUsage=codeSigning"
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL could not create the preview certificate" }
            & openssl pkcs12 -export -out signing.pfx -inkey signing.key `
              -in signing.pem -passout "pass:$password"
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL could not create the signing bundle" }
            "WINDOWS_CERTIFICATE_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append
            "SIGNING_KIND=self-signed-preview" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Sign application executable
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $signArgs = @("sign", "/fd", "SHA256", "/f", "signing.pfx", "/p", $env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($env:SIGNING_KIND -eq "trusted") {
            $signArgs += @("/tr", "http://timestamp.digicert.com", "/td", "SHA256")
          }
          & $signtool @signArgs "dist\Student Placement Planner\Student Placement Planner.exe"
          if ($LASTEXITCODE -ne 0) { throw "The application executable could not be signed" }

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          $versionMatch = [regex]::Match($env:RELEASE_VERSION, '^(\d+)\.(\d+)\.(\d+)(?:b(\d+))?')
          if (-not $versionMatch.Success) { throw "Release version is not valid" }
          $buildNumber = if ($versionMatch.Groups[4].Success) { $versionMatch.Groups[4].Value } else { "0" }
          $numericVersion = "$($versionMatch.Groups[1].Value).$($versionMatch.Groups[2].Value).$($versionMatch.Groups[3].Value).$buildNumber"
          & $iscc `
            "/DAppVersion=$env:RELEASE_VERSION" `
            "/DAppNumericVersion=$numericVersion" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\dist\Student Placement Planner" `
            packaging\windows\installer.iss

      - name: Sign and verify installer
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $installer = (Get-ChildItem release\*-Setup.exe | Select-Object -First 1).FullName
          $signArgs = @("sign", "/fd", "SHA256", "/f", "signing.pfx", "/p", $env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($env:SIGNING_KIND -eq "trusted") {
            $signArgs += @("/tr", "http://timestamp.digicert.com", "/td", "SHA256")
          }
          & $signtool @signArgs $installer
          if ($LASTEXITCODE -ne 0) { throw "The installer could not be signed" }
          if ($env:SIGNING_KIND -eq "trusted") {
            & $signtool verify /v /pa $installer
            if ($LASTEXITCODE -ne 0) { throw "The trusted installer signature is invalid" }
          } else {
            $signature = Get-AuthenticodeSignature $installer
            if ($null -eq $signature.SignerCertificate -or $signature.Status -in @("NotSigned", "HashMismatch")) {
              throw "The preview installer signature is missing or invalid"
            }
          }
          Get-FileHash $installer -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($installer))"
          } | Set-Content release\SHA256SUMS-Windows.txt
          "Signing: $env:SIGNING_KIND" | Set-Content release\SIGNING-Windows.txt

      - name: Smoke-test install, launch, and uninstall
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release\*-Setup.exe | Select-Object -First 1).FullName
          $installDir = "$env:RUNNER_TEMP\StudentPlacementPlanner"
          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installDir`""
          $install = Start-Process $installer -ArgumentList $arguments -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $env:SPP_SELF_TEST_REPORT = "$env:RUNNER_TEMP\installed-optimizer-self-test.txt"
          $optimizationTest = Start-Process `
            -FilePath "$installDir\Student Placement Planner.exe" `
            -ArgumentList "--self-test-optimization" -Wait -PassThru
          if ($optimizationTest.ExitCode -ne 0) {
            if (Test-Path $env:SPP_SELF_TEST_REPORT) { Get-Content $env:SPP_SELF_TEST_REPORT }
            throw "Installed OR-Tools runtime check failed"
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $app = Start-Process "$installDir\Student Placement Planner.exe" -PassThru
          Start-Sleep -Seconds 4
          if ($app.HasExited) { throw "Installed application exited during smoke test" }
          Stop-Process -Id $app.Id -Force
          $uninstall = Start-Process "$installDir\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build version
        env:
          TAG_VERSION: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${TAG_VERSION#v}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$MANUAL_VERSION" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and build dependencies
        run: python -m pip install '.[test,offline-maps,build]'

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build macOS icon and application
        run: |
          sh packaging/macos/build_icon.sh
          pyinstaller --clean --noconfirm packaging/student-placement-planner.spec

      - name: Check bundled native dependencies
        run: |
          APP="dist/Student Placement Planner.app/Contents/MacOS/Student Placement Planner"
          "$APP" --self-test-optimization
          "$APP" --self-test-offline-builder

      - name: Import Developer ID certificate when configured
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          PASSWORD=$(uuidgen)
          python -c 'import base64, os; open(os.environ["RUNNER_TEMP"] + "/certificate.p12", "wb").write(base64.b64decode(os.environ["MACOS_CERTIFICATE_BASE64"]))'
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n '1s/.*"\(.*\)"/\1/p')
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KIND=developer-id" >> "$GITHUB_ENV"

      - name: Record ad-hoc fallback
        if: env.MACOS_CERTIFICATE_BASE64 == ''
        run: echo "SIGNING_KIND=ad-hoc-preview" >> "$GITHUB_ENV"

      - name: Package disk image
        run: sh packaging/macos/package_dmg.sh "dist/Student Placement Planner.app" "$RELEASE_VERSION"

      - name: Notarize configured Developer ID build
        if: env.MACOS_CERTIFICATE_BASE64 != '' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          DMG=$(find release -name '*.dmg' -print -quit)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          echo "SIGNING_KIND=developer-id-notarized" >> "$GITHUB_ENV"

      - name: Verify and checksum disk image
        run: |
          DMG=$(find release -name '*.dmg' -print -quit)
          hdiutil verify "$DMG"
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            codesign --verify --verbose=2 "$DMG"
          fi
          shasum -a 256 "$DMG" | sed 's#release/##' > release/SHA256SUMS-macOS.txt
          printf 'Signing: %s\n' "$SIGNING_KIND" > release/SIGNING-macOS.txt

      - name: Smoke-test disk image and application launch
        run: |
          DMG=$(find release -name '*.dmg' -print -quit)
          MOUNT="$RUNNER_TEMP/spp-mount"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse
          "$MOUNT/Student Placement Planner.app/Contents/MacOS/Student Placement Planner" --self-test-optimization
          QT_QPA_PLATFORM=offscreen "$MOUNT/Student Placement Planner.app/Contents/MacOS/Student Placement Planner" &
          APP_PID=$!
          sleep 4
          kill -0 "$APP_PID"
          kill "$APP_PID"
          wait "$APP_PID" || true
          hdiutil detach "$MOUNT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-apple-silicon
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create combined checksums
        run: |
          cd release-artifacts
          sha256sum *.exe *.dmg > SHA256SUMS.txt

      - name: Attest release binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-artifacts/*.exe
            release-artifacts/*.dmg

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Beta 2 corrects the Windows packaging problem in Beta 1. The Windows installer now carries the OR-Tools native libraries and Microsoft Visual C++ runtime it needs on a clean PC, and the release gate performs a packaged optimization before and after installation.

          Student Placement Planner includes spreadsheet entry and CSV import, capacity and placement rules, ordered placement goals, manual travel times, no-key community routing, openrouteservice and Google options, and offline OpenStreetMap regions downloaded directly from Geofabrik and prepared inside the app.

          Windows and macOS builds use preview signatures unless their attached `SIGNING` files say otherwise. Checksums and GitHub build attestations are included with the release.
          EOF
          gh release create "$TAG" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Student Placement Planner $TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            --prerelease
